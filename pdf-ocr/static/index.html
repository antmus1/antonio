<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF → Markdown OCR</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <header class="topbar">
    <div class="topbar-left">
      <span class="logo">PDF → Markdown OCR</span>
      <span id="filename-label" class="filename-label"></span>
    </div>
    <div class="topbar-right">
      <label for="file-input" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/>
          <line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
        Carica PDF
      </label>
      <input type="file" id="file-input" accept=".pdf" hidden>
    </div>
  </header>

  <div class="toolbar" id="toolbar" hidden>
    <div class="toolbar-group">
      <button id="prev-btn" class="btn btn-icon" title="Pagina precedente" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span id="page-label" class="page-label">1 / 1</span>
      <button id="next-btn" class="btn btn-icon" title="Pagina successiva" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>

    <div class="toolbar-group">
      <button id="ocr-page-btn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
        OCR Pagina
      </button>
      <button id="ocr-all-btn" class="btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>
        OCR Tutte
      </button>
    </div>

    <div class="toolbar-group toolbar-right">
      <button id="toggle-raw-btn" class="btn btn-sm">Raw</button>
      <button id="copy-btn" class="btn btn-sm" title="Copia markdown">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copia
      </button>
      <button id="download-btn" class="btn btn-sm" title="Scarica tutto il markdown">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Scarica
      </button>
    </div>
  </div>

  <main id="main">
    <div class="drop-zone" id="drop-zone">
      <div class="drop-zone-inner">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="12"/>
          <line x1="9" y1="15" x2="15" y2="15"/>
        </svg>
        <h2>Trascina un PDF qui</h2>
        <p>oppure</p>
        <label for="file-input" class="btn btn-primary">Scegli File PDF</label>
      </div>
    </div>

    <div class="split-view" id="split-view" hidden>
      <div class="panel" id="left-panel">
        <div class="panel-header">
          <span>Documento</span>
          <span id="page-info" class="muted"></span>
        </div>
        <div class="panel-body" id="pdf-panel-body">
          <img id="page-img" alt="Pagina PDF">
        </div>
      </div>

      <div class="splitter" id="splitter"></div>

      <div class="panel" id="right-panel">
        <div class="panel-header">
          <span>Risultato Markdown</span>
          <span id="ocr-status" class="muted"></span>
        </div>
        <div class="panel-body" id="md-panel-body">
          <div id="md-preview" class="md-preview"></div>
          <textarea id="md-raw" class="md-raw" spellcheck="false" readonly hidden></textarea>
        </div>
      </div>
    </div>
  </main>

  <footer class="statusbar">
    <span id="status-msg">Pronto. Carica un PDF per iniziare.</span>
    <div class="progress-wrap" id="progress-wrap" hidden>
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
